# D&B Informatique — publication sur Netlify
# Site statique : aucune commande de construction, les fichiers du dépôt sont publiés tels quels.
[build]
  publish = "."

# En-têtes de sécurité envoyés par le serveur (GitHub Pages ne permettait pas de les définir)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fichiers techniques du dépôt : inutile de les servir
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Anciennes adresses (avant la page unique) : redirections permanentes.
# Ne pas recréer de fichier « diagnostic.html » ou « mentions-legales.html » : Netlify le servirait à la place
# du dossier du même nom et créerait une boucle de redirection.
[[redirects]]
  from = "/offres"
  to = "/#offres"
  status = 301
  force = true
